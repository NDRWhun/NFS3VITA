    <ellipse cx="70" cy="300" rx="190" ry="120" fill="url(#redGlow)"/>
    <ellipse cx="442" cy="300" rx="190" ry="120" fill="url(#blueGlow)"/>

    <path d="M0 330 L120 300 L190 318 L256 296 L330 316 L400 298 L512 326 L512 512 L0 512 Z" fill="#081233"/>

    <path d="M236 312 L276 312 L470 512 L42 512 Z" fill="url(#road)"/>
    <path d="M236 312 L42 512 L60 512 L240 312 Z" fill="#e8eefc" opacity="0.7"/>
    <path d="M276 312 L470 512 L452 512 L272 312 Z" fill="#e8eefc" opacity="0.7"/>
    <g fill="#ffcf2e">
      <path d="M254 318 L258 318 L259 330 L253 330 Z"/>
      <path d="M252 344 L260 344 L262 366 L250 366 Z"/>
      <path d="M249 386 L263 386 L266 420 L246 420 Z"/>
      <path d="M244 448 L268 448 L273 512 L239 512 Z"/>
    </g>

    <rect x="0" y="309" width="512" height="5" fill="url(#horizon)"/>

    <g stroke="#e8eefc" stroke-linecap="round" opacity="0.35">
      <line x1="40" y1="250" x2="150" y2="244" stroke-width="3"/>
      <line x1="20" y1="276" x2="120" y2="272" stroke-width="2"/>
      <line x1="362" y1="244" x2="472" y2="250" stroke-width="3"/>
      <line x1="392" y1="272" x2="492" y2="276" stroke-width="2"/>
