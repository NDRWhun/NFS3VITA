    </radialGradient>
    <radialGradient id="blueGlow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#4a92ff" stop-opacity="0.85"/>
      <stop offset="1" stop-color="#2a7bff" stop-opacity="0"/>
    </radialGradient>
    <clipPath id="disc">
      <circle cx="256" cy="256" r="232"/>
