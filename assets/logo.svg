  <g font-family="Arial Black, Arial, Helvetica, sans-serif" font-weight="900" font-style="italic" text-anchor="middle">
    <text x="262" y="236" font-size="132" fill="#000a24" opacity="0.55" transform="skewX(-8)">NFS3</text>
    <text x="256" y="230" font-size="132" fill="url(#chrome)" stroke="#0a1a4a" stroke-width="4" paint-order="stroke" transform="skewX(-8)">NFS3</text>
    <text x="256" y="292" font-size="54" fill="#ffffff" letter-spacing="14" stroke="#05081a" stroke-width="6" paint-order="stroke">VITA</text>
